name = "forwardfake"
main = "worker.js"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "ForwardScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ForwardScheduler"]
