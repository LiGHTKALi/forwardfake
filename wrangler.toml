name = "munitos"
main = "worker.js"
compatibility_date = "2026-11-21"
workers_dev = true
preview_urls = false

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "MUNITOS"
class_name = "MunitosRuntime"

[exports.MunitosRuntime]
type = "durable-object"
storage = "sqlite"

[observability]
enabled = true
head_sampling_rate = 1
