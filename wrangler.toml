name = "forwardfake"
main = "worker.js"
compatibility_date = "2026-11-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
# deploy.bat / deploy.sh / npm run deploy:auto writes this automatically.
OWNER_TELEGRAM_ID = ""

[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "ForwardScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ForwardScheduler"]
