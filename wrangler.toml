name = "munitos"
main = "worker.js"
compatibility_date = "2026-11-20"
workers_dev = true
preview_urls = false

[vars]
# This is based on the workers.dev subdomain used by the previous Worker.
# Change only this URL if the Cloudflare account subdomain is different.
WEBHOOK_URL = "https://munitos.killerdutchmobin.workers.dev/telegram/webhook"

[triggers]
# One generic tick drives database-defined schedules and queue recovery.
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "MUNITOS"
class_name = "MunitosRuntime"

[exports.MunitosRuntime]
type = "durable-object"
storage = "sqlite"

[observability]
enabled = true
head_sampling_rate = 1
